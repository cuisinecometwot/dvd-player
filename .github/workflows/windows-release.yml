# Builds the experimental Windows version (installer + portable zip) and publishes it as a pre-release.
# Trigger: push a tag like v0.2.0-windows-experimental.1. Pushes to main (or a manual run) build and
# test the same way but only upload the files as a workflow artifact, without a release.
#
# The app runs on python.org Python with PySide6's official Qt (native Windows look, uses Windows' own ICU).
# MSYS2 is only the toolchain for the minimal FFmpeg and the source of cd-paranoia/cd-info.
name: Windows build

on:
  push:
    tags: ["v*-windows*"]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"
  PYSIDE_VERSION: 6.12.0
  VLC_VERSION: 3.0.24
  FFMPEG_VERSION: 8.1.3
  # Full static FFmpeg, only to generate test files for the smoke tests; never bundled.
  FIXTURE_FFMPEG_ZIP: ffmpeg-n8.1-latest-win64-gpl-8.1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip unzip make diffutils
          pacboy: >-
            toolchain:p nasm:p pkgconf:p libdvdnav:p libdvdread:p opus:p zlib:p libcdio:p libcdio-paranoia:p

      - name: Version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = tag ] || tag="dev-${GITHUB_SHA::7}"
          num=$(echo "$tag" | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "NUM_VERSION=${num:-0.0.0}" >> "$GITHUB_ENV"

      - name: Python packages and domain tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller "PySide6-Essentials==${PYSIDE_VERSION}" python-vlc pytest
          python -m pytest -q tests

      - name: Cache minimal FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmin
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ hashFiles('packaging/windows/build-ffmpeg.sh') }}-ucrt64

      - name: Build minimal FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -o pipefail  # the build output is filtered below; a failed build must still fail the step
          curl -fsSL -o ffmpeg-src.tar.xz "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          tar xf ffmpeg-src.tar.xz
          sh packaging/windows/build-ffmpeg.sh "ffmpeg-${FFMPEG_VERSION}" "$PWD/ffmin" 2>&1 | grep -vE '^(CC|AR|LD|STRIP|INSTALL|GEN|X86ASM|HOSTCC|HOSTLD|BIN2C|GZIP|MINIFY)\b'

      - name: Build app with PyInstaller
        shell: bash
        run: pyinstaller --noconfirm packaging/windows/dvdplayer.spec

      - name: Bundle FFmpeg, cd-paranoia and cd-info with their DLLs
        shell: msys2 {0}
        run: |
          bin=dist/DvdPlayer/bin
          mkdir -p "$bin"
          cp ffmin/bin/ffmpeg.exe ffmin/bin/ffprobe.exe ffmin/bin/*.dll "$bin/"
          cp /ucrt64/bin/cd-paranoia.exe /ucrt64/bin/cd-info.exe "$bin/"
          # ldd lists the whole dependency closure; take what comes from MSYS2 (the rest is Windows itself).
          for f in "$bin"/*.exe "$bin"/*.dll; do ldd "$f"; done | awk '$3 ~ /^\/ucrt64\// {print $3}' | sort -u \
            | xargs -r cp -n -t "$bin/"
          ls -la "$bin"
          du -sh "$bin"

      - name: Bundle VLC (libvlc + plugins, includes libdvdcss)
        shell: msys2 {0}
        run: |
          curl -fsSL -o vlc.zip "https://download.videolan.org/pub/videolan/vlc/${VLC_VERSION}/win64/vlc-${VLC_VERSION}-win64.zip"
          unzip -q vlc.zip
          mkdir -p dist/DvdPlayer/vlc
          cp -r "vlc-${VLC_VERSION}"/libvlc.dll "vlc-${VLC_VERSION}"/libvlccore.dll "vlc-${VLC_VERSION}"/plugins dist/DvdPlayer/vlc/
          sh packaging/windows/trim-vlc.sh dist/DvdPlayer/vlc/plugins
          # Plugin cache, so libvlc doesn't scan every plugin DLL at each start.
          "vlc-${VLC_VERSION}/vlc-cache-gen.exe" dist/DvdPlayer/vlc/plugins || echo "::warning::vlc-cache-gen failed"
          du -sh dist/DvdPlayer/vlc
          cp LICENSE README.md dist/DvdPlayer/
          curl -fsSL -o fixture-ffmpeg.zip \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${FIXTURE_FFMPEG_ZIP}.zip"
          unzip -q fixture-ffmpeg.zip -d fixture

      - name: Smoke tests (bundled FFmpeg runs the app's commands, bundled VLC plays the results)
        shell: bash
        run: |
          set -o pipefail
          ISOLATE=1 python packaging/windows/smoke_ffmpeg.py dist/DvdPlayer/bin \
            "fixture/${FIXTURE_FFMPEG_ZIP}/bin/ffmpeg.exe" smoke-rips
          # The runner has no sound device, hence VLC's audio-output errors.
          python packaging/windows/smoke_vlc.py dist/DvdPlayer/vlc smoke-rips 2>&1 | grep -v "failed to create audio output"

      - name: Startup test (the packaged exe starts, loads Qt and libvlc, and logs no crash)
        shell: pwsh
        run: |
          $logs = Join-Path $env:TEMP "dvd-player-logs"
          Remove-Item $logs -Recurse -Force -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath "dist\DvdPlayer\DvdPlayer.exe" -PassThru
          Start-Sleep -Seconds 15
          $alive = -not $app.HasExited
          if ($alive) { Stop-Process -Id $app.Id -Force }
          $log = Get-ChildItem $logs -Filter *.log -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $log) { Write-Error "no log file: the exe failed before logging (exit code $($app.ExitCode))"; exit 1 }
          $text = Get-Content $log.FullName -Raw
          Write-Output $text
          $missing = @("ui=qt", "libvlc ", "drive status") | Where-Object { -not $text.Contains($_) }
          if (-not $alive) { Write-Error "the app exited by itself (code $($app.ExitCode))"; exit 1 }
          if ($missing) { Write-Error "log lacks: $($missing -join ', ')"; exit 1 }
          if ($text.Contains("CRITICAL")) { Write-Error "uncaught exception logged"; exit 1 }

      - name: Sizes
        shell: bash
        run: du -sh dist/DvdPlayer dist/DvdPlayer/*/ | sort -h

      - name: Portable zip
        shell: msys2 {0}
        run: |
          cd dist && zip -qr "../DvdPlayer-${TAG}-windows-portable.zip" DvdPlayer
          ls -la ../*.zip

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:TAG" "/DNumVersion=$env:NUM_VERSION" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\dist\DvdPlayer" "/DOutputName=DvdPlayer-$env:TAG-windows-setup" `
            packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "packaging\windows\Output\DvdPlayer-$env:TAG-windows-setup.exe" .

      - uses: actions/upload-artifact@v4
        with:
          name: DvdPlayer-${{ env.TAG }}-windows
          path: |
            DvdPlayer-*-windows-portable.zip
            DvdPlayer-*-windows-setup.exe
          retention-days: 14

      - name: Publish pre-release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG `
            "DvdPlayer-$env:TAG-windows-setup.exe" "DvdPlayer-$env:TAG-windows-portable.zip" `
            --prerelease --title "Windows build (experimental) $env:TAG" `
            --notes-file packaging/windows/release-notes.md
